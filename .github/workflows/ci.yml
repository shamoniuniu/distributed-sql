name: Fast CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.1"

      - name: Install locked dependencies
        run: uv sync --dev --frozen

      - name: Check production engine independence
        run: uv run python scripts/verify_engine_independence.py

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run complete Mypy
        run: uv run -- python -m mypy

      - name: Check documentation
        shell: pwsh
        run: ./scripts/verify-docs.ps1

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Render Kubernetes configuration
        run: kubectl kustomize deploy/kubernetes > /dev/null

      - name: Run non-stress tests
        run: |
          mkdir -p artifacts/ci
          uv run pytest -m "not stress" --junitxml artifacts/ci/fast-junit.xml

      - name: Upload fast JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-junit
          path: artifacts/ci/fast-junit.xml
          if-no-files-found: warn
          retention-days: 14
