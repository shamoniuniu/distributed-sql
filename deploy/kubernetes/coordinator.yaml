apiVersion: v1
kind: Service
metadata:
  name: coordinator
  labels:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: coordinator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-sql
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-sql
        app.kubernetes.io/component: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: distributed-sql-coordinator:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: distributed-sql-config
            - secretRef:
                name: distributed-sql-object-store
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: catalog
              mountPath: /var/lib/distributed-sql/catalog
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          persistentVolumeClaim:
            claimName: coordinator-catalog
        - name: tmp
          emptyDir: {}
