apiVersion: v1
kind: ConfigMap
metadata:
  name: distributed-sql-config
data:
  DISTRIBUTED_SQL_COORDINATOR_HOST: "0.0.0.0"
  DISTRIBUTED_SQL_COORDINATOR_PORT: "8080"
  DISTRIBUTED_SQL_COORDINATOR_CATALOG_PATH: /var/lib/distributed-sql/catalog/catalog.db
  DISTRIBUTED_SQL_COORDINATOR_OBJECT_STORE_ENDPOINT: http://minio:9000
  DISTRIBUTED_SQL_COORDINATOR_OBJECT_STORE_BUCKET: distributed-sql
  DISTRIBUTED_SQL_COORDINATOR_OBJECT_STORE_REGION: us-east-1
  DISTRIBUTED_SQL_COORDINATOR_OBJECT_STORE_SECURE: "false"
  DISTRIBUTED_SQL_COORDINATOR_OBJECT_STORE_CREATE_BUCKET: "true"
  DISTRIBUTED_SQL_WORKER_HOST: "0.0.0.0"
  DISTRIBUTED_SQL_WORKER_PORT: "8091"
  DISTRIBUTED_SQL_WORKER_COORDINATOR_URL: http://coordinator:8080
  DISTRIBUTED_SQL_WORKER_HEARTBEAT_INTERVAL_SECONDS: "2"
  DISTRIBUTED_SQL_WORKER_REGISTRATION_RETRY_SECONDS: "1"
  DISTRIBUTED_SQL_WORKER_MEMORY_LIMIT_BYTES: "67108864"
  DISTRIBUTED_SQL_WORKER_TEMP_DIRECTORY: /var/lib/distributed-sql/tmp
  DISTRIBUTED_SQL_WORKER_OBJECT_STORE_ENDPOINT: http://minio:9000
  DISTRIBUTED_SQL_WORKER_OBJECT_STORE_BUCKET: distributed-sql
  DISTRIBUTED_SQL_WORKER_OBJECT_STORE_REGION: us-east-1
  DISTRIBUTED_SQL_WORKER_OBJECT_STORE_SECURE: "false"
