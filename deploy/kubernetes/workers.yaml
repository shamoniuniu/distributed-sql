apiVersion: v1
kind: Service
metadata:
  name: workers
  labels:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 8091
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: distributed-sql
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-sql
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-sql
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: distributed-sql-worker:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DISTRIBUTED_SQL_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISTRIBUTED_SQL_WORKER_ADVERTISED_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: distributed-sql-config
            - secretRef:
                name: distributed-sql-object-store
          ports:
            - name: http
              containerPort: 8091
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import json,urllib.request;
                  data=json.load(urllib.request.urlopen(
                  'http://127.0.0.1:8091/health',timeout=2));
                  assert data['status']=='healthy' and
                  data['dependencies']['coordinator']=='registered'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: worker-tmp
              mountPath: /var/lib/distributed-sql/tmp
            - name: system-tmp
              mountPath: /tmp
      volumes:
        - name: worker-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: system-tmp
          emptyDir: {}
